[tool.bandit]
exclude_dirs = [".venv", "venv", "env", "build", "dist"]
skips = ["B101"]  # Skip assert_used for now

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 100
ignore = ["E203", "W503", "E501"]
exclude = [".git", ".venv", "venv", "env", "build", "dist"]
per-file-ignores = [
    "__init__.py:F401"
]
